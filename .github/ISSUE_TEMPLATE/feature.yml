---
name: "Feature Request"
description: "Submit a feature request"
labels: ["feature"]
body:
  - type: textarea
    id: problem-statement
    attributes:
      label: What is the problem you are trying to solve with this feature?
      placeholder: A clear and concise description of what the problem is. Ex. I'm always frustrated when [...]
    validations:
      required: true

  - type: textarea
    id: feature-solution
    attributes:
      label: What is the solution you are proposing?
      placeholder: A clear and concise description of what you want to happen.

  - type: textarea
    id: worksarounds
    attributes:
      label: Possible workarounds
      placeholder: What is the other way to solve your problem on current release, if exists?

  - type: textarea
    id: feature-details
    attributes:
      label: Additional context
      placeholder: Add any other context or screenshots about on the matter

  - type: checkboxes
    id: checks
    attributes:
      label: Contributions
      description: Please confirm any the following
      options:
        - label: I have searched through existing issues and to see if my idea has already been proposed.
          required: true
        - label: If this feature is accepted, I would be willing to help implement and maintain this feature.
          required: false
        - label: If this feature is accepted, I'm willing to sponsor the development of this feature.
          required: false
