name: Build dev container

on:
  push:
    branches:
      - dev

permissions:
  packages: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image build metadata
        id: image_meta
        run: |
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILDKIT: 1
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERSION=dev
            BUILD_REVISION=${{ github.sha }}
            BUILD_CREATED=${{ steps.image_meta.outputs.created }}
            IMAGE_REF_NAME=dev
            DISTROLESS_TAG=debug-nonroot
          annotations: |
            index,manifest:org.opencontainers.image.title=sudoStream
            index,manifest:org.opencontainers.image.description=Self-hosted media server using jellyfin-ffmpeg
            index,manifest:org.opencontainers.image.source=https://github.com/fed1337/sudostream
            index,manifest:org.opencontainers.image.url=https://github.com/fed1337/sudostream
            index,manifest:org.opencontainers.image.documentation=https://github.com/fed1337/sudostream/blob/master/README.md
            index,manifest:org.opencontainers.image.licenses=MIT
            index,manifest:org.opencontainers.image.vendor=fed1337
            index,manifest:org.opencontainers.image.version=dev
            index,manifest:org.opencontainers.image.revision=${{ github.sha }}
            index,manifest:org.opencontainers.image.created=${{ steps.image_meta.outputs.created }}
            index,manifest:org.opencontainers.image.ref.name=dev
          tags: |
            ghcr.io/fed1337/sudostream:dev
