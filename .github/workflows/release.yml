name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: "!startsWith(github.event.head_commit.message, 'bump:')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Create bump and changelog
        id: cz
        uses: commitizen-tools/commitizen-action@0.27.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          changelog_increment_filename: body.md
          commitizen_version: '4.18.0'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image build metadata
        id: image_meta
        run: |
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILDKIT: 1
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERSION=${{ steps.cz.outputs.version }}
            BUILD_REVISION=${{ github.sha }}
            BUILD_CREATED=${{ steps.image_meta.outputs.created }}
            IMAGE_REF_NAME=v${{ steps.cz.outputs.version }}
            DISTROLESS_TAG=nonroot
          annotations: |
            index,manifest:org.opencontainers.image.title=sudoStream
            index,manifest:org.opencontainers.image.description=Self-hosted media server using jellyfin-ffmpeg
            index,manifest:org.opencontainers.image.source=https://github.com/fed1337/sudostream
            index,manifest:org.opencontainers.image.url=https://github.com/fed1337/sudostream
            index,manifest:org.opencontainers.image.documentation=https://github.com/fed1337/sudostream/blob/master/README.md
            index,manifest:org.opencontainers.image.licenses=MIT
            index,manifest:org.opencontainers.image.vendor=fed1337
            index,manifest:org.opencontainers.image.version=${{ steps.cz.outputs.version }}
            index,manifest:org.opencontainers.image.revision=${{ github.sha }}
            index,manifest:org.opencontainers.image.created=${{ steps.image_meta.outputs.created }}
            index,manifest:org.opencontainers.image.ref.name=v${{ steps.cz.outputs.version }}
          tags: |
            ghcr.io/fed1337/sudostream:latest
            ghcr.io/fed1337/sudostream:v${{ steps.cz.outputs.version }}

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: body.md
          tag_name: v${{ steps.cz.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
